name: lab_4_pam
description: "LAB4 PAM - Online Course App (REST API + Clean Architecture, varianta 4)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # Cereri HTTP catre serviciul Web (REST API)
  http: ^1.6.0
  # State management: Cubit (din pachetul BLoC), ca la Lab 3
  flutter_bloc: ^9.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    # Doar ilustratia decorativa din slider; restul imaginilor vin din API
    - assets/images/

  # Fontul folosit in design (Poppins)
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
